id: mission-25m2
engine: dimensions
category: spaces
difficulty: beginner
duration_minutes: 5
icon: house
color: coral
title:
  fr: "Mission 25 m²"
  en: "25 m² Mission"
description:
  fr: "Trouve les dimensions parfaites d'un mini-logement."
  en: "Find the perfect dimensions for a tiny home."
mission:
  fr: "Ton client veut exactement 25 m² et une largeur d'au moins 4 m. Ajuste le plan !"
  en: "Your client wants exactly 25 m² and a width of at least 4 m. Adjust the plan!"
concepts:
  fr: ["Surface", "Dimensions"]
  en: ["Area", "Dimensions"]
parameters:
  width: {min: 3, max: 9, step: 1, initial: 4}
  length: {min: 3, max: 9, step: 1, initial: 6}
constraints:
  - {type: area_equals, value: 25}
  - {type: min_width, value: 4}
hints:
  fr: ["La surface est la largeur multipliée par la longueur.", "Quels nombres multipliés donnent 25 ?"]
  en: ["Area equals width times length.", "Which two numbers multiply to 25?"]
feedback:
  success: {fr: "Bravo ! Le plan répond aux besoins du client.", en: "Well done! Your plan meets the client's needs."}
