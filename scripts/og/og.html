<!doctype html>
<html><head><meta charset="utf-8"/>
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;overflow:hidden;font-family:Arial,"Liberation Sans",Helvetica,sans-serif;background:#142e37;color:#fff;position:relative}
  .glow{position:absolute;right:-120px;top:-160px;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle,#416b6c 0%,#244951 45%,#142e37 72%)}
  .left{position:absolute;left:72px;top:70px;width:600px}
  .brand{display:flex;align-items:center;gap:22px}
  .mark{width:92px;height:92px;border-radius:26px;background:#d7ebac;display:grid;place-items:center}
  .name{font-size:96px;font-weight:700;letter-spacing:-4px;line-height:1}
  .name b{color:#d7ebac;font-size:52px;letter-spacing:-1px}
  h1{font-size:60px;line-height:1.06;letter-spacing:-2.5px;margin-top:46px;font-weight:700}
  p{margin-top:22px;font-size:26px;line-height:1.4;color:#c0d3d4}
  .chips{position:absolute;left:72px;bottom:44px;display:flex;gap:12px}
  .chips span{background:#27454e;color:#e3f4b7;font-weight:700;font-size:22px;padding:11px 20px;border-radius:99px}
  svg.art{position:absolute;right:40px;top:70px}
</style></head>
<body>
  <div class="glow"></div>
  <div class="left">
    <div class="brand">
      <div class="mark"><svg width="58" height="58" viewBox="0 0 64 64"><circle cx="32" cy="32" r="22" fill="none" stroke="#142e37" stroke-width="6"/><path d="M42 22 35.5 35.5 22 42 28.5 28.5z" fill="#142e37"/></svg></div>
      <div class="name">EduArchi<b>.xyz</b></div>
    </div>
    <h1 id="title">TITLE</h1>
    <p id="sub">SUB</p>
  </div>
  <div class="chips" id="chips"></div>
  <svg class="art" width="470" height="440" viewBox="0 0 470 440">
    <!-- sun -->
    <circle cx="372" cy="92" r="44" fill="#f6d49d"/><circle cx="372" cy="92" r="62" fill="none" stroke="#f6d49d" stroke-opacity=".25" stroke-width="14"/>
    <!-- plan card -->
    <g transform="translate(10 250) rotate(-7)">
      <rect width="210" height="170" rx="16" fill="#f2f6f0"/>
      <rect x="18" y="18" width="174" height="134" fill="#fbfaf6" stroke="#37545b" stroke-width="6"/>
      <rect x="21" y="21" width="80" height="62" fill="#c9dcea"/><rect x="101" y="21" width="88" height="62" fill="#f4e2a1"/>
      <rect x="21" y="83" width="116" height="66" fill="#f2c9b4"/><rect x="137" y="83" width="52" height="66" fill="#cfe5da"/>
      <path d="M101 21V83M21 83H189M137 83V149" stroke="#6b7f84" stroke-width="3"/>
      <path d="M58 83v-26a26 26 0 0 1 26 26" fill="none" stroke="#bd8e6a" stroke-width="2.5" stroke-dasharray="5 4"/>
    </g>
    <!-- isometric blocks (same projection as the blocks game) -->
    <g transform="translate(330 250)" stroke="#7a6430" stroke-width="2" stroke-linejoin="round">
        <path d="M-53.7 -31.0L0.0 0.0L0.0 -62.0L-53.7 -93.0Z" fill="#e2c477"/>
        <path d="M0.0 -186.0L53.7 -155.0L0.0 -124.0L-53.7 -155.0Z" fill="#f4e2a1"/>
        <path d="M-53.7 -93.0L0.0 -62.0L0.0 -124.0L-53.7 -155.0Z" fill="#e2c477"/>
        <path d="M53.7 -93.0L0.0 -62.0L0.0 -124.0L53.7 -155.0Z" fill="#c9a85e"/>
        <path d="M0.0 62.0L53.7 93.0L53.7 31.0L0.0 0.0Z" fill="#e2c477"/>
        <path d="M107.4 62.0L53.7 93.0L53.7 31.0L107.4 0.0Z" fill="#c9a85e"/>
        <path d="M-53.7 -31.0L0.0 0.0L-53.7 31.0L-107.4 0.0Z" fill="#f4e2a1"/>
        <path d="M-107.4 62.0L-53.7 93.0L-53.7 31.0L-107.4 0.0Z" fill="#e2c477"/>
        <path d="M0.0 62.0L-53.7 93.0L-53.7 31.0L0.0 0.0Z" fill="#c9a85e"/>
        <path d="M53.7 -93.0L107.4 -62.0L53.7 -31.0L0.0 -62.0Z" fill="#f4e2a1"/>
        <path d="M0.0 0.0L53.7 31.0L53.7 -31.0L0.0 -62.0Z" fill="#e2c477"/>
        <path d="M107.4 0.0L53.7 31.0L53.7 -31.0L107.4 -62.0Z" fill="#c9a85e"/>
    </g>
  </svg>
</body></html>
